<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>Grade: color and edit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b>Grade</b>
  <div class="act"><button id="undo">Undo</button><button id="redo">Redo</button><button id="open">Add</button><button id="cmp">Hold: before</button></div>
</header>
<main>
  <section id="stage">
    <div id="view"><canvas id="cv"></canvas><canvas id="ov"></canvas><canvas id="sc" width="240" height="128"></canvas><p id="hint">Tap Add to load photos, videos or audio. Everything stays on your device.</p></div>
    <div id="tr"><button id="pp">Play</button><span id="tm">0:00.0 / 0:00.0</span><button id="scb">Scope: off</button><button id="rst">Reset grade</button></div>
    <div id="tl"></div>
  </section>
  <aside><nav id="tabs"></nav><div id="pn"></div></aside>
</main>
<nav id="pg"><button data-g="Media">Media</button><button data-g="Cut">Cut</button><button data-g="Edit">Edit</button><button data-g="Color" class="on">Color</button><button data-g="Audio">Audio</button><button data-g="Deliver">Deliver</button></nav>
<input type="file" id="file" accept="image/*,video/*,audio/*" multiple hidden>
<script src="app.js"></script>
</body>
</html>
