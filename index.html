<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>Grade: color and edit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b>Grade</b>
  <nav id="pg"><button data-g="Color" class="on">Color</button><button data-g="Edit">Edit</button></nav>
  <div class="act"><button id="open">Add</button><button id="cmp">Hold: before</button><button id="exp" class="pri">Export</button></div>
</header>
<main>
  <section id="stage">
    <div id="view"><canvas id="cv"></canvas><canvas id="ov"></canvas><canvas id="sc" width="240" height="128"></canvas><p id="hint">Tap Add to load photos, videos or audio. Everything stays on your device.</p></div>
    <div id="tr"><button id="pp">Play</button><span id="tm">0:00.0 / 0:00.0</span><button id="scb">Scope: off</button><button id="rst">Reset grade</button></div>
    <div id="tl"></div>
  </section>
  <aside><nav id="tabs"></nav><div id="pn"></div></aside>
</main>
<input type="file" id="file" accept="image/*,video/*,audio/*" multiple hidden>
<script src="app.js"></script>
  <script src="js/persist.js"></script>
<script src="js/history.js"></script>
<script src="js/masks.js"></script>
<script>
(async () => {
  // ⚠️ Intha 3 idathula unga site-oda variable names podanum
  const getState = () => ({ /* unga grade values: exposure, contrast, lift, gamma... */ });
  const setState = s => { /* values-a UI + render-la apply pannunga */ };
  const PREVIEW  = '#preview';            // video/canvas element-oda selector

  const saved = await Persist.get('app');
  Masks.init({
    preview: PREVIEW,
    source: () => document.querySelector(PREVIEW),
    saved: saved?.masks,
    onSave: () => save(),
    onChange: () => rerender(),           // unga render function
    onCommit: label => GradeHistory.commit(label)
  });
  GradeHistory.init({
    getState: () => ({ grade: getState(), masks: Masks.serialize() }),
    setState: s => { setState(s.grade); Masks.load(s.masks); },
    save: h => Persist.set('history', h),
    saved: await Persist.get('history')
  });
  if (saved?.grade) setState(saved.grade);
  const save = () => Persist.autosave('app', () => ({ grade: getState(), masks: Masks.serialize() }));

  // Slider release / photo apply aagum podhu:  GradeHistory.commit('Exposure'); save();
  // Media add pannum podhu: Persist.saveMedia(id, file);  Thirumba open-la: await Persist.loadMedia(id)
})();
</script>
</body>
</html>
