<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>Grade: cinematic color and edit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <b>Grade</b>
  <div class="act">
    <button id="open">Open</button>
    <button id="cmp">Hold: before</button>
    <button id="rst">Reset</button>
    <button id="exp" class="pri">Export</button>
  </div>
</header>
<main>
  <section id="stage">
    <canvas id="cv"></canvas>
    <p id="hint">Tap Open to load a photo or video. Everything stays on your device.</p>
    <div id="vb" hidden><button id="pp">Play</button><input type="range" id="sk" min="0" max="1000" value="0"></div>
  </section>
  <aside><nav id="tabs"></nav><div id="pn"></div></aside>
</main>
<input type="file" id="file" accept="image/*,video/*" hidden>
<script src="app.js"></script>
</body>
</html>
